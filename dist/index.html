--p);color:#fff;border-radius:9px;padding:2px 7px;font-size:11px;font-weight:700}.value{font-size:18px;font-weight:760;letter-spacing:-.4px}.sub,.date{font-size:13px;margin-top:5px}.date{color:var(--muted)}.add{display:grid;place-items:center;color:var(--p);border-color:#aa91ee;font-weight:650;font-size:14px}.add b{font-size:29px;font-weight:400;display:block}.empty{color:var(--muted);padding:18px 4px}.back{font-size:24px;margin-right:6px}.top.left{justify-content:flex-start}.eyebrow{font-size:14px;color:var(--muted);margin-top:-7px}.bestbox{background:var(--pl);border:1px solid #a98ef5;border-radius:16px;padding:14px 16px;margin:22px 0}.bestbox small{display:block;color:var(--muted);margin-bottom:5px}.bestbox strong{font-size:20px}.chart-wrap{height:220px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin:10px 0 22px}.chart-wrap svg{width:100%;height:100%;overflow:visible}.history{border-radius:15px;border:1px solid var(--line);overflow:hidden;background:var(--card)}.history-row{display:grid;grid-template-columns:1fr .8fr .6fr;gap:8px;padding:13px 14px;border-bottom:1px solid var(--line);font-size:14px}.history-row:last-child{border:0}.settings{display:grid;gap:10px}.setting,.list-row{width:100%;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:15px;display:flex;justify-content:space-between;text-align:left}.danger{color:var(--danger)}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--line);padding:4px;border-radius:13px}.seg button{padding:9px 5px;font-size:13px;border-radius:10px}.seg .on{background:var(--p);color:#fff}.section-card{padding:15px;background:var(--card);border:1px solid var(--line);border-radius:16px}.fab{position:fixed;bottom:22px;right:max(20px,calc((100vw - 720px)/2 + 16px));width:52px;height:52px;border-radius:17px;background:var(--p);color:#fff;font-size:28px;box-shadow:0 8px 20px #39207855}.modal-bg{position:fixed;inset:0;background:#0c081980;disp </style></head><body><main id="app"></main><script>
const DB='mis-marcas', STORE='state', TYPES={wr:'Peso + repeticiones',w:'Solo peso',r:'Solo repeticiones',t:'Tiempo'};let state,view={page:'home',filter:'all'},editing=null,longTimer;
const id=()=>crypto.randomUUID(),$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function load(){let db=await openDB();return new Promise(ok=>{let r=db.transaction(STORE).objectStore(STORE).get('app');r.onsuccess=()=>ok(r.result||seed());})}async function save(){let db=await openDB();return new Promise((ok,no)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).put(state,'app');r.onsuccess=ok;r.onerror=no})}
function seed(){let names=['Piernas','Brazos','Espalda','Pecho','Hombros','Abdominales'];return{version:1,theme:'auto',groups:names.map((name,order)=>({id:id(),name,order})),exercises:[],marks:[]}}
function sortedGroups(){return [...state.groups].sort((a,b)=>a.order-b.order)}function exercises(group){return state.exercises.filter(x=>x.groupId===group.id).sort((a,b)=>a.order-b.order)}function marks(ex){return state.marks.filter(m=>m.exerciseId===ex.id).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt.localeCompare(b.createdAt))}function latest(ex){return marks(ex).at(-1)}function best(ex){let a=marks(ex);return a.length?a.reduce((b,m)=>compare(m,b,ex.type)>0?m:b):null}function compare(a,b,t){let av=t==='t'?a.duration:t==='r'?a.reps:a.weight,bv=t==='t'?b.duration:t==='r'?b.reps:b.weight;if(av!==bv)return av-bv;return t==='wr'?(a.reps||0)-(b.reps||0):0}function fmt(m,t,short=false){if(t==='t'){let x=m.duration||0;return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')}let v=t==='r'?m.reps:m.weight, unit=t==='r'?' rep':' kg';return String(v).replace('.',',')+unit}function dateShort(d){let a=d.split('-');return a[2]+'-'+a[1]}function today(n=0){let d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)}function groupName(ex){return state.groups.find(g=>g.id===ex.groupId)?.name||''}function applyTheme(){document.documentElement.dataset.theme=state.theme==='auto'?'':state.theme}
function render(){applyTheme();let a=$('#app');if(view.page==='home')a.innerHTML=home();else if(view.page==='detail')a.innerHTML=detail(view.exercise);else if(view.page==='settings')a.innerHTML=settings();else if(view.page==='manage')a.innerHTML=managePage();else if(view.page==='groups')a.innerHTML=groupsPage();else if(view.page==='exercises')a.innerHTML=exercisesPage();bind()}
function home(){let gs=sortedGroups().filter(g=>view.filter==='all'||g.id===view.filter);return`<div class="top"><h1>Mis marcas</h1><button class="icon" onclick="go('settings')" aria-label="Ajustes">⚙</button></div><div class="chips"><button class="chip ${view.filter==='all'?'active':''}" onclick="filter('all')">Todos</button>${sortedGroups().map(g=>`<button class="chip ${view.filter===g.id?'active':''}" onclick="filter('${g.id}')">${esc(g.name)}</button>`).join('')}</div>${gs.map(g=>`<section><h2>${esc(g.name)}</h2>${exercises(g).map(ex=>exerciseCard(ex)).join('')||'<div class="empty">Todavía no hay ejercicios.</div>'}</section>`).join('')}<button class="fab" onclick="editExercise()" aria-label="Agregar ejercicio">+</button>`}
function exerciseCard(ex){let all=marks(ex),shown=all.slice(-3),b=best(ex);return`<div class="exercise"><button class="exercise-title" onclick="openDetail('${ex.id}')">${esc(ex.name)}</button><div class="mark-row">${shown.map(m=>markCard(m,ex,b)).join('')}<button class="mark add" onclick="editMark('${ex.id}')"><span><b>＋</b>Agregar</span></button></div></div>`}function markCard(m,ex,b){let is=b&&m.id===b.id;return`<button class="mark ${is?'best':''}" onpointerdown="startLong(event,'${m.id}')" onpointerup="clearLong()" onpointerleave="clearLong()" onclick="clearLong()">${is?'<span class="badge">Mejor</span>':''}<div class="value">${fmt(m,ex.type)}</div>${ex.type==='wr'?`<div class="sub">${m.reps} rep</div>`:''}<div class="date">${dateShort(m.date)}</div></button>`}
function detail(exid){let ex=state.exercises.find(x=>x.id===exid),b=best(ex),all=marks(ex), pts=all.map((m,i)=>({x:i,y:ex.type==='t'?m.duration:ex.type==='r'?m.reps:m.weight,l:dateShort(m.date)}));return`<div class="top left"><button class="back" onclick="go('home')" aria-label="Volver">‹</button><div><h1>${esc(ex.name)}</h1><div class="eyebrow">${esc(groupName(ex))}</div></div></div>${b?`<div class="bestbox"><small>Mejor marca</small><strong>${fmt(b,ex.type)}${ex.type==='wr'?' × '+b.reps+' rep':''}</strong><div class="date">${dateShort(b.date)}</div></div>`:''}<h3>Evolución de ${ex.type==='r'?'repeticiones':ex.type==='t'?'tiempo':'peso'}</h3>${chart(pts)}<h2>Historial</h2><div class="history">${[...all].reverse().map(m=>`<div class="history-row"><strong>${fmt(m,ex.type)}</strong><span>${ex.type==='wr'?m.reps+' rep':''}</span><span>${dateShort(m.date)}</span></div>`).join('')||'<div class="empty">Sin marcas todavía.</div>'}</div><button class="fab" onclick="editMark('${ex.id}')" aria-label="Agregar marca">+</button>`}
function chart(p){if(!p.length)return'<div class="chart-wrap"><div class="empty">Las marcas aparecerán acá.</div></div>';let max=Math.max(...p.map(x=>x.y)),min=Math.min(...p.map(x=>x.y)),range=max-min||1,w=360,h=180,xy=p.map((q,i)=>`${20+i*(320/Math.max(1,p.length-1))},${155-(q.y-min)/range*115}`);return`<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Gráfico de evolución"><line x1="20" x2="340" y1="155" y2="155" stroke="var(--line)"/><line x1="20" x2="20" y1="25" y2="155" stroke="var(--line)"/><text x="2" y="31" fill="var(--muted)" font-size="11">${max}</text><text x="2" y="158" fill="var(--muted)" font-size="11">${min}</text><polyline fill="none" stroke="var(--p)" stroke-width="3" points="${xy.join(' ')}"/>${xy.map(x=>`<circle cx="${x.split(',')[0]}" cy="${x.split(',')[1]}" r="4" fill="var(--p)"/>`).join('')}<text x="20" y="176" fill="var(--muted)" font-size="11">${p[0].l}</text><text x="290" y="176" fill="var(--muted)" font-size="11">${p.at(-1).l}</text></svg></div>`}
function settings(){return`<div class="top left"><button class="back" onclick="go('home')">‹</button><h1>Ajustes</h1></div><div class="settings"><div class="section-card"><h3>Modo de visualización</h3><div class="seg">${[['auto','Automático'],['light','Claro'],['dark','Oscuro']].map(x=>`<button class="${state.theme===x[0]?'on':''}" onclick="theme('${x[0]}')">${x[1]}</button>`).join('')}</div></div><button class="setting" onclick="go('manage')">Grupos y ejercicios <span>›</span></button><button class="setting" onclick="exportData()">Exportar datos <span>›</span></button><button class="setting" onclick="$('#import').click()">Importar datos <span>›</span></button><input id="import" class="hidden" type="file" accept="application/json" onchange="importData(event)"><button class="setting danger" onclick="confirmDeleteAll()">Eliminar todos los datos <span>›</span></button></div>`}
function managePage(){return`<div class="top left"><button class="back" onclick="go('settings')">‹</button><h1>Grupos y ejercicios</h1></div><div class="settings"><button class="setting" onclick="go('groups')">Grupos <span>›</span></button><button class="setting" onclick="go('exercises')">Ejercicios <span>›</span></button></div>`}
function groupsPage(){return`<div class="top left"><button class="back" onclick="go('manage')">‹</button><h1>Grupos</h1></div><div class="settings">${sortedGroups().map(g=>`<div class="list-row" draggable="true" ondragstart="dragGroup='${g.id}'" ondragover="event.preventDefault()" ondrop="dropGroup('${g.id}')"><span class="handle">☰</span><button class="list-main" onclick="editGroup('${g.id}')"><strong>${esc(g.name)}</strong><div class="meta">${exercises(g).length} ejercicio${exercises(g).length===1?'':'s'}</div></button></div>`).join('')}</div><button class="fab" onclick="editGroup()">+</button>`}
function exercisesPage(){return`<div class="top left"><button class="back" onclick="go('manage')">‹</button><h1>Ejercicios</h1></div><div class="settings">${state.exercises.sort((a,b)=>groupName(a).localeCompare(groupName(b))||a.order-b.order).map(ex=>`<div class="list-row" draggable="true" ondragstart="dragEx='${ex.id}'" ondragover="event.preventDefault()" ondrop="dropEx('${ex.id}')"><span class="handle">☰</span><button class="list-main" onclick="editExercise('${ex.id}')"><strong>${esc(ex.name)}</strong><div class="meta">${esc(groupName(ex))} · ${TYPES[ex.type]}</div></button></div>`).join('')||'<div class="empty">Agregá el primer ejercicio.</div>'}</div><button class="fab" onclick="editExercise()">+</button>`}
</script><script>
function bind(){}function go(p){view={page:p,filter:'all'};render()}function filter(x){view.filter=x;render()}function openDetail(x){view={page:'detail',exercise:x};render()}async function theme(t){state.theme=t;await save();render()}function startLong(e,mid){clearLong();longTimer=setTimeout(()=>showMarkMenu(mid),550)}function clearLong(){clearTimeout(longTimer)}
function modal(html){document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="sheet">${html}</div></div>`)}function closeModal(){$('#modal')?.remove()}function typeFields(type,m={}){if(type==='t')return`<div class="field"><label>Tiempo (mm:ss)</label><input id="duration" inputmode="numeric" placeholder="1:20" value="${m.duration?fmt(m,'t'):''}"></div>`;let weight=type!=='r',reps=type==='wr'||type==='r';return`${weight?step('weight','Peso (kg)',m.weight??'',.5):''}${reps?step('reps','Repeticiones',m.reps??'',1):''}`}function step(key,label,val,inc){return`<div class="field"><label>${label}</label><div class="steppers"><button onclick="bump('${key}',-${inc})">−</button><input id="${key}" inputmode="decimal" value="${val}"><button onclick="bump('${key}',${inc})">+</button></div><div class="hint">(−/+ cambia ${String(inc).replace('.',',')} ${key==='weight'?'kg':'rep'})</div></div>`}function bump(k,n){let el=$('#'+k),v=parseFloat(String(el.value).replace(',','.'))||0;el.value=Math.max(0,Math.round((v+n)*10)/10)}
function editMark(exid,mid){let ex=state.exercises.find(x=>x.id===exid),m=mid?state.marks.find(x=>x.id===mid):latest(ex)||{},choice='today';editing={exid,mid,choice};modal(`<h2>${mid?'Editar marca':'Nueva marca'}</h2><div class="eyebrow">${esc(ex.name)} · ${esc(groupName(ex))}</div><div class="field"><label>Fecha</label><div class="datepick"><button class="on" id="d-today" onclick="dateChoice('today')">Hoy</button><button id="d-yesterday" onclick="dateChoice('yesterday')">Ayer</button><button id="d-other" onclick="dateChoice('other')">Otra fecha</button></div><input id="otherdate" class="hidden" type="date" value="${m.date||today()}"></div>${typeFields(ex.type,m)}<div id="formerror" class="error"></div><div class="actions"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveMark()">Guardar</button></div>`);if(mid){choice='other';editing.choice='other';dateChoice('other')} }
function dateChoice(c){editing.choice=c;['today','yesterday','other'].forEach(x=>$('#d-'+x).classList.toggle('on',x===c));$('#otherdate').classList.toggle('hidden',c!=='other')}function parseDuration(s){let a=s.trim().split(':');if(a.length!==2)return NaN;let n=+a[0]*60 + +a[1];return Number.isInteger(n)&&+a[1]<60&&n>=0?n:NaN}async function saveMark(){let ex=state.exercises.find(x=>x.id===editing.exid),d=editing.choice==='today'?today():editing.choice==='yesterday'?today(1):$('#otherdate').value,weight, reps, duration;if(ex.type==='t'){duration=parseDuration($('#duration').value)}else{weight=ex.type==='r'?undefined:Number(String($('#weight').value).replace(',','.'));reps=ex.type==='w'?undefined:Number($('#reps').value)}let bad=!d||(ex.type!=='r'&&ex.type!=='t'&&(!Number.isFinite(weight)||weight<0||Math.round(weight*10)!==weight*10))||(ex.type!=='w'&&ex.type!=='t'&&(!Number.isInteger(reps)||reps<0))||(ex.type==='t'&&!Number.isFinite(duration));if(bad){$('#formerror').textContent='Revisá los valores ingresados.';return}if(editing.mid&&!confirm('¿Guardar cambios en esta marca?'))return;let m=editing.mid?state.marks.find(x=>x.id===editing.mid):{id:id(),exerciseId:ex.id,createdAt:new Date().toISOString()};Object.assign(m,{date:d,weight,reps,duration});if(!editing.mid)state.marks.push(m);await save();closeModal();render();toast('Marca guardada · Editar',()=>editMark(ex.id,m.id))}
function showMarkMenu(mid){let m=state.marks.find(x=>x.id===mid);modal(`<div class="menu"><button onclick="closeModal();editMark('${m.exerciseId}','${m.id}')">Editar</button><button class="danger" onclick="deleteMark('${m.id}')">Eliminar</button><button onclick="closeModal()">Cancelar</button></div>`)}async function deleteMark(mid){if(!confirm('¿Seguro que querés eliminar esta marca?'))return;state.marks=state.marks.filter(m=>m.id!==mid);await save();closeModal();render()}function toast(t,fn){let e=document.createElement('button');e.className='toast';e.textContent=t;e.onclick=()=>{e.remove();fn?.()};document.body.append(e);setTimeout(()=>e.remove(),3500)}
function editExercise(exid){let ex=exid?state.exercises.find(x=>x.id===exid):{},g=state.groups.find(x=>x.id===(ex.groupId||view.filter))||sortedGroups()[0],type=ex.type||(g.name==='Abdominales'?'r':'wr');modal(`<h2>${exid?'Editar ejercicio':'Nuevo ejercicio'}</h2><div class="field"><label>Nombre</label><input id="exname" value="${esc(ex.name||'')}" placeholder="Ej. Back squat"></div><div class="field"><label>Grupo</label><select id="exgroup">${sortedGroups().map(x=>`<option value="${x.id}" ${x.id===g.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Tipo de marca</label><select id="extype">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===type?'selected':''}>${v}</option>`).join('')}</select></div><div id="exerr" class="error"></div><div class="actions"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveExercise('${exid||''}')">Guardar</button></div>${exid?'<button class="setting danger" style="margin-top:12px" onclick="deleteExercise(\''+exid+'\')">Eliminar ejercicio</button>':''}`)}async function saveExercise(exid){let name=$('#exname').value.trim(),groupId=$('#exgroup').value,type=$('#extype').value;if(!name){$('#exerr').textContent='Ingresá un nombre.';return}let ex=exid?state.exercises.find(x=>x.id===exid):{id:id(),order:exercises(state.groups.find(g=>g.id===groupId)).length};if(exid&&ex.type!==type&&marks(ex).length){if(type==='t'&&!confirm('Al cambiar a Tiempo se eliminará el historial. ¿Continuar?'))return;if(type!=='t'&&!confirm('Se adaptarán los datos disponibles al nuevo tipo. ¿Continuar?'))return;if(type==='t')state.marks=state.marks.filter(m=>m.exerciseId!==ex.id);else state.marks.filter(m=>m.exerciseId===ex.id).forEach(m=>{if(type==='w')delete m.reps;if(type==='r')delete m.weight})}Object.assign(ex,{name,groupId,type});if(!exid)state.exercises.push(ex);await save();closeModal();render()}async function deleteExercise(x){if(!confirm('¿Seguro que querés eliminar este ejercicio y sus marcas?'))return;state.marks=state.marks.filter(m=>m.exerciseId!==x);state.exercises=state.exercises.filter(e=>e.id!==x);await save();closeModal();render()}
function editGroup(gid){let g=gid?state.groups.find(x=>x.id===gid):{};modal(`<h2>${gid?'Editar grupo':'Nuevo grupo'}</h2><div class="field"><label>Nombre</label><input id="gname" value="${esc(g.name||'')}" placeholder="Ej. Cardio"></div><div id="gerr" class="error"></div><div class="actions"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveGroup('${gid||''}')">Guardar</button></div>${gid?'<button class="setting danger" style="margin-top:12px" onclick="deleteGroup(\''+gid+'\')">Eliminar grupo</button>':''}`)}async function saveGroup(gid){let name=$('#gname').value.trim();if(!name){$('#gerr').textContent='Ingresá un nombre.';return}if(state.groups.some(g=>g.name.toLowerCase()===name.toLowerCase()&&g.id!==gid)){$('#gerr').textContent='Ya existe un grupo con ese nombre.';return}let g=gid?state.groups.find(x=>x.id===gid):{id:id(),order:state.groups.length};g.name=name;if(!gid)state.groups.push(g);await save();closeModal();render()}function deleteGroup(gid){let es=state.exercises.filter(e=>e.groupId===gid);if(!es.length){if(confirm('¿Eliminar este grupo?'))removeGroup(gid);return}let options=state.groups.filter(g=>g.id!==gid);modal(`<h2>Este grupo tiene ejercicios</h2><p class="hint">Elegí qué hacer con sus ejercicios.</p><div class="field"><label>Mover ejercicios a</label><select id="movegroup">${options.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div><div class="actions"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="moveAndRemove('${gid}')">Mover ejercicios</button></div><button class="setting danger" style="margin-top:12px" onclick="removeGroup('${gid}',true)">Eliminar grupo y ejercicios</button>`)}async function moveAndRemove(gid){let to=$('#movegroup').value;state.exercises.filter(e=>e.groupId===gid).forEach(e=>e.groupId=to);await removeGroup(gid)}async function removeGroup(gid,all){let ids=state.exercises.filter(e=>e.groupId===gid).map(e=>e.id);if(all){if(!confirm('¿Eliminar grupo y todos sus ejercicios y marcas?'))return;state.exercises=state.exercises.filter(e=>e.groupId!==gid);state.marks=state.marks.filter(m=>!ids.includes(m.exerciseId))}state.groups=state.groups.filter(g=>g.id!==gid);state.groups.forEach((g,i)=>g.order=i);await save();closeModal();render()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='mis-marcas-respaldo.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0],r=new FileReader();r.onload=async()=>{try{let d=JSON.parse(r.result);if(!d.groups||!d.exercises||!d.marks||!confirm('Se reemplazarán todos los datos actuales. ¿Continuar?'))return;state=d;await save();render();toast('Datos importados')}catch{toast('El archivo no es válido')}};if(f)r.readAsText(f)}async function confirmDeleteAll(){if(confirm('Esto eliminará todas las marcas, ejercicios y grupos. No se puede deshacer.')){state=seed();await save();go('home')}}let dragEx,dragGroup;async function dropEx(target){let a=state.exercises.findIndex(e=>e.id===dragEx),b=state.exercises.findIndex(e=>e.id===target);if(a<0||b<0)return;[state.exercises[a].order,state.exercises[b].order]=[state.exercises[b].order,state.exercises[a].order];await save();render()}async function dropGroup(target){let a=state.groups.findIndex(g=>g.id===dragGroup),b=state.groups.findIndex(g=>g.id===target);if(a<0||b<0)return;[state.groups[a].order,state.groups[b].order]=[state.groups[b].order,state.groups[a].order];await save();render()}
window.addEventListener('DOMContentLoaded',async()=>{state=await load();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('/mis-marcas/sw.js',{scope:'/mis-marcas/'})});
</script></main></body></html>
